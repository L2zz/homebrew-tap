name: Update claudeye formula

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find latest claudeye release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api repos/L2zz/claudeye/releases/latest --jq .tag_name)"
          url="https://github.com/L2zz/claudeye/archive/refs/tags/$tag.tar.gz"
          sha256="$(curl -fsSL "$url" | shasum -a 256 | awk '{print $1}')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Update formula
        env:
          ARCHIVE_URL: ${{ steps.release.outputs.url }}
          ARCHIVE_SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          sed -i '' "s|^  url .*|  url \"$ARCHIVE_URL\"|" Formula/claudeye.rb
          sed -i '' "s|^  sha256 .*|  sha256 \"$ARCHIVE_SHA256\"|" Formula/claudeye.rb

      - name: Validate formula
        run: |
          ruby -c Formula/claudeye.rb
          brew style Formula/claudeye.rb

      - name: Publish update
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/claudeye.rb
          git commit -m "claudeye $TAG"
          git push
